version: 2

builds:
  - binary: rh
    env:
      - CGO_ENABLED=0
    goos: [darwin, linux]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  # No version in the name so releases/latest/download/<name> is a stable URL.
  - name_template: "rh_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    files: [README.md, INSTALL.md, LICENSE]

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude: ["^docs:", "^test:", "^chore:"]
